<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M-Cross OneDrive Auth Test</title>
  <style>
    body{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;margin:0;padding:24px;background:#f7f7fb;color:#222}
    main{max-width:560px;margin:auto;padding:22px;border:1px solid #ddd;border-radius:18px;background:#fff}
    button{width:100%;min-height:52px;margin-top:12px;border:0;border-radius:12px;background:#2672ec;color:#fff;font:inherit;font-weight:800}
    #status{margin-top:16px;padding:12px;border-radius:10px;background:#eef4ff;overflow-wrap:anywhere}
    small{display:block;margin-top:12px;color:#666;line-height:1.5}
  </style>
</head>
<body>
<main>
  <h1>OneDrive認証テスト</h1>
  <p>M-Cross本体とは分離したPC開発用テストです。</p>
  <button id="login" type="button">Microsoftでサインイン</button>
  <div id="status">未サインイン</div>
  <small>このページはOneDriveへデータを保存・読込しません。</small>
</main>
<script type="module">
  import { PublicClientApplication } from '@azure/msal-browser'

  const status = document.querySelector('#status')
  const login = document.querySelector('#login')
  const msal = new PublicClientApplication({
    auth: {
      clientId: '783680c7-c4fc-4028-bacd-e25497f40334',
      authority: 'https://login.microsoftonline.com/3ac7d9e7-5765-41cc-8e82-3c27d62cea00',
      redirectUri: window.location.origin + '/auth-redirect.html',
    },
    cache: { cacheLocation: 'sessionStorage' },
  })

  await msal.initialize()
  const existing = msal.getAllAccounts()[0]
  if (existing) status.textContent = 'サインイン済み: ' + existing.username

  login.addEventListener('click', async () => {
    try {
      status.textContent = 'Microsoftに接続中…'
      const result = await msal.loginPopup({ scopes: ['User.Read', 'Files.ReadWrite.AppFolder'] })
      status.textContent = 'サインイン成功: ' + (result.account?.username || 'アカウント取得済み')
    } catch (error) {
      console.error(error)
      status.textContent = 'サインイン失敗: ' + (error?.errorCode || error?.message || String(error))
    }
  })
</script>
</body>
</html>
